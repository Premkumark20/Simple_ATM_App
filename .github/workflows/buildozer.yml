name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip build-essential \
            autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev libltdl-dev cmake gettext autopoint libsqlite3-dev

      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3.0.0" "setuptools<70.0.0" virtualenv
          pip install git+https://github.com/kivy/buildozer.git

      - name: Build Android APK with Buildozer
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: atmbanking-debug-apk
          path: bin/*.apk

