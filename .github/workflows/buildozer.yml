name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip build-essential \
            autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev libltdl-dev cmake gettext autopoint libsqlite3-dev \
            ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          pip install "Cython==0.29.33" "setuptools<70.0.0" virtualenv
          pip install buildozer

      - name: Build Android APK with Buildozer
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          buildozer -v android debug

      - name: Print build logs on failure
        if: failure()
        run: |
          echo "=== LAST 150 LINES OF BUILDOZER LOG ==="
          find .buildozer -name "*.log" -exec tail -n 150 {} + 2>/dev/null || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: atmbanking-debug-apk
          path: bin/*.apk

