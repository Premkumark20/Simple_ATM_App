name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip build-essential \
            autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev \
            libffi-dev libssl-dev libltdl-dev cmake gettext

      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3.0.0" buildozer virtualenv "setuptools<70.0.0"

      - name: Build Android APK with Buildozer
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          yes | buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: atmbanking-debug-apk
          path: bin/*.apk

